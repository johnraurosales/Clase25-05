<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Survey Form</title>
</head>
<body>
    <header>
        <h1 id="title">freeCodeCamp Survey Form
        </h1>
        <p id="description">Thank you for taking the time to help us improve the platform</p>
    </header>
    <main>
        <form id="survey-form">
            <!-- Grupo 1: Datos de contacto -->
            <div class="form-group">
                <label id="name-label" for="name">Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label id="email-label" for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your Email" required>
            </div>

            <div class="form-group">
                <label id="number-label" for="number">Age</label>
                <input type="number" name="number" id="number" min="10" max="100" placeholder="Age" required>
            </div>

            <!-- Grupo 2: Desplegable Rol -->
            <div class="form-group">
                <label for="dropdown">Which option best describes your current role?</label>
                <select id="dropdown" name="current-role" required>
                    <option value="" disabled selected>Select current role</option>
                    <option value="student">Student</option>
                    <option value="job">Full Time Job</option>
                    <option value="learner">Full Time Learner</option>
                </select>
            </div>

            <!-- Grupo 3: Radio Buttons (Recomendación) -->
            <fieldset class="form-group">
                <legend>Would you recommend freeCodeCamp to a friend?</legend>

                <input type="radio" id="definitely" name="recommend" value="definitely" checked>
                <label for="definitely">Definitely</label>

                <input type="radio" id="maybe" name="recommend" value="maybe">
                <label for="maybe">Maybe</label>

                <input type="radio" id="not-sure" name="recommend" value="not-sure">
                <label for="not-sure">Not sure</label>
            </fieldset>

            <!-- Grupo 4: Desplegable Características -->
            <div class="form-group">
                <label for="dropdown2">What is your favorite feature of freeCodeCamp?</label>
                <select id="dropdown2" name="feature" required>
                    <option value="" disabled selected>Select an option</option>
                    <option value="challenge">Challenges</option>
                    <option value="project">Projects</option>
                    <option value="community">Community</option>
                </select>
            </div>

            <!-- Grupo 5: Checkboxes (Mejoras) -->
            <fieldset class="form-group">
                <legend>What would you like to see improved? (Check all that apply)</legend>

                <input type="checkbox" id="frontend" name="improve" value="frontend">
                <label for="frontend">Front-end Projects</label>

                <input type="checkbox" id="backend" name="improve" value="backend">
                <label for="backend">Back-end Projects</label>

                <input type="checkbox" id="data" name="improve" value="data">
                <label for="data">Data Visualization</label>

                <input type="checkbox" id="challenges" name="improve" value="challenges">
                <label for="challenges">Challenges</label>

                <input type="checkbox" id="open-source" name="improve" value="open-source">
                <label for="open-source">Open Source Community</label>
            </fieldset>

            <!-- Grupo 6: Comentarios y Botón -->
            <div class="form-group">
                <label for="comments">Any comments or suggestions?</label>
                <textarea id="comments" name="comments" placeholder="Enter your comment here..."></textarea>
            </div>

            <div class="form-group">
                <button id="submit" type="submit">Submit</button>
            </div>
        </form>
    </main>

</body>
</html>
