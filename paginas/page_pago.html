<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Checkout Page</title>
</head>
<body>
    <header>
        <h1>Checkout</h1>
    </header>
    <main>
        <section>
            <h2>Your Cart</h2>
            <img src="https://cdn.freecodecamp.org/curriculum/labs/spoon.jpg" alt="Prueba">
            <p>Left-handed spoon</p>
            <p>$29.99</p>
        </section>
        <section>
            <h2>Payment Information</h2>
            <form id="payment-form">
                <label for="card-name">Cardholder Name <span aria-hidden="true">*</span></label>
                <input type="text" id="card-name" name="card-name" required><br>
                <label for="card-number">Card Number <span aria-hidden="true">*</span></label>
                <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
                <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
                <label for="expiry-date">Expiry Date<span aria-hidden="true">*</span></label>
                <input type="date" id="expiry-date" name="expiry-date" required><br>
                <label for="cvv">CVV <span aria-hidden="true">*</span></label>
                <input type="number" id="cvv" name="cvv" required><br>
                <button type="submit">Place Order</button>
            </form>
        </section>
    </main>
</body>
</html>
